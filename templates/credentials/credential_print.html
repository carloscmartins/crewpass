{% extends 'base.html' %}

{% block title %}Imprimir credencial · {{ event.name }} · CrewPass{% endblock %}

{% block extra_head %}
<style>
  @page { margin: 12mm; }
  .print-card { width: max-content; max-width: 100%; }
  @media print {
    body { min-height: 0; background: #fff !important; color: #000 !important; }
    .screen-only { display: none !important; }
    .print-card { border: 0 !important; background: #fff !important; color: #000 !important; }
    .print-card img { width: 40mm; height: 40mm; }
  }
</style>
{% endblock %}

{% block body %}
<main class="mx-auto max-w-3xl px-4 py-8 sm:px-6 lg:py-12">
  <div class="screen-only mb-6 flex flex-wrap items-center justify-between gap-3">
    <a class="text-sm text-muted underline decoration-line underline-offset-4 hover:text-brand" href="{% url 'credentials:list' organization.slug event.pk %}">← Voltar às credenciais</a>
    <button class="min-h-11 bg-brand px-5 text-sm font-semibold uppercase tracking-wider text-black hover:bg-brand-strong" onclick="window.print()" type="button">Imprimir</button>
  </div>
  <article class="print-card mx-auto flex flex-col items-center justify-center gap-2 border border-line bg-white p-5 text-center text-black">
    <p class="text-[9px] font-semibold uppercase tracking-[0.2em]">CrewPass · Credencial de equipe</p>
    <img class="size-36 max-w-full" src="{{ qr_image }}" alt="QR Code da credencial para {{ event.name }}">
    <h1 class="max-w-full break-words text-sm font-semibold">{{ event.name }}</h1>
    <p class="text-[9px] uppercase tracking-wider">Apresente este código para identificação</p>
  </article>
</main>
{% endblock %}
